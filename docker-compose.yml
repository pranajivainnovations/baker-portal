# version omitted deliberately — matches the pranajiva-backend / crossfriend-ops compose files
# already running in production; modern Docker Compose treats the top-level `version:` key as
# obsolete and warns about it.

services:
  crossfriend-baker-portal:
    image: crossfriend-baker-portal:latest
    container_name: crossfriend-baker-portal
    ports:
      - "5000:5000"
    environment:
      # This app reads exactly ONE variable, verified by grepping process.env across src/.
      #
      # There is deliberately no DATABASE_URL and no signing secret here. The portal cannot verify a
      # session, cannot read the database, and cannot decide what a baker owns — it holds an opaque
      # token issued by the backend and forwards it, and every authorization question is answered
      # by the backend on every request. If a future change wants credentials in this file, the
      # logic being written almost certainly belongs in the backend instead.
      NODE_ENV: production
      PORT: 5000

      # Where to reach the CrossFriend backend. Server-to-server, so this should be the backend's
      # reachable address from this container — not a browser-facing URL.
      MEDUSA_BACKEND_URL: ${MEDUSA_BACKEND_URL}
    restart: unless-stopped
    healthcheck:
      # 127.0.0.1 not localhost, and /login not / — see the Dockerfile's HEALTHCHECK comment.
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:5000/login"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
